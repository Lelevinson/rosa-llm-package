name: Package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        profile: [base, langchain]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.2"
      - run: uv python install "${{ matrix.python }}"
      - name: Install base package
        if: matrix.profile == 'base'
        run: uv sync --locked
      - name: Install LangChain and integration dependencies
        if: matrix.profile == 'langchain'
        run: uv sync --locked --extra langchain --group integration
      - run: uv run --locked --no-sync pytest -q
      - run: uv run --locked --no-sync ruff check .
      - run: uv run --locked --no-sync ruff format --check .
      - run: uv lock --check
      - run: uv build
