name: Package checks
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source revision to check; empty uses the event revision
        required: false
        default: ""
        type: string
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        profile: [base, langchain]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.2"
      - run: uv python install "${{ matrix.python }}"
      - name: Install base package
        if: matrix.profile == 'base'
        run: uv sync --locked
      - name: Install LangChain and integration dependencies
        if: matrix.profile == 'langchain'
        run: uv sync --locked --extra langchain --group integration
      - run: uv run --locked --no-sync pytest -q
      - run: uv run --locked --no-sync ruff check .
      - run: uv run --locked --no-sync ruff format --check .
      - run: uv lock --check
      - run: uv build
