[project]
name = "rosa-llm"
version = "0.1.0"
description = "Standalone Ollama and ChatGPT OAuth clients with a shared Python API and CLI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "levii831" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
]

[project.urls]
Repository = "https://github.com/Lelevinson/rosa-llm-package"
Issues = "https://github.com/Lelevinson/rosa-llm-package/issues"

[project.scripts]
rosa-llm = "rosa_llm.cli:main"

[project.optional-dependencies]
langchain = [
    "langchain-core==0.3.86",
]

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-plugin-autoload"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
integration = [
    "jpl-rosa==1.0.10",
    "langchain==0.3.30",
]
